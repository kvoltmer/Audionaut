# Windows CI on CircleCI.
#
# Mirrors .github/workflows/windows.yml: builds the Projucer-generated Visual
# Studio solution with MSBuild, then builds and runs the Catch2 suite.
# See that workflow for the full rationale behind the individual steps; the
# comments here cover only what is CircleCI-specific.
version: 2.1

orbs:
  win: circleci/windows@5.1

jobs:
  build-windows:
    executor:
      name: win/default # windows-server-2022-gui:current, Visual Studio 2022
      size: medium
      # Git bash instead of the orb's PowerShell default: with PowerShell, a
      # failing native command mid-script does not fail the step unless every
      # call is followed by an explicit $LASTEXITCODE check.
      shell: bash.exe -eo pipefail
    environment:
      BUILD_TYPE: Release

      # The image ships Visual Studio 2022 (toolset v143); the .vcxproj that
      # Projucer generates asks for v145 (VS 2026), which no hosted image
      # provides. Override on the command line rather than in the .jucer - the
      # checked-in project must keep matching the toolset developers build with
      # locally, and v143 still compiles the C++20 the project needs. Drop this
      # once an image ships v145.
      APP_TOOLSET: v143

      # Essentia's Windows dependencies. The triplet must stay
      # x64-windows-static-md - static libraries against the dynamic CRT, which
      # is what both the .vcxproj and the JUCE CMake test target use.
      VCPKG_TRIPLET: x64-windows-static-md
      VCPKG_ROOT_DIR: C:/Users/circleci/vcpkg
      # Read by the .vcxproj, which expands $(AUDIONAUT_VCPKG_PREFIX) in its
      # include and library paths, and passed to the test configure. Forward
      # slashes throughout: MSBuild, MSVC and CMake all accept them, and they
      # avoid escaping this value twice.
      AUDIONAUT_VCPKG_PREFIX: C:/Users/circleci/vcpkg/installed/x64-windows-static-md

      # Keep git-lfs from smudging during checkout / submodule update: the
      # essentia submodule's upstream has LFS disabled, and the resulting
      # download errors would fail the clone. The test wavs that really do
      # live in LFS are pulled explicitly below.
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - checkout

      # CircleCI's checkout step does not fetch submodules (unlike
      # actions/checkout with submodules: recursive).
      - run:
          name: Fetch submodules
          command: git submodule update --init --recursive

      - run:
          name: Fetch Git LFS test files
          command: git lfs pull

      # Essentia. build_essentia.sh cannot be used - it is a bash + waf script
      # targeting macOS/Linux - so this runs the CMake + vcpkg port instead.
      # It has to come before the app build: the .vcxproj lists essentia.lib in
      # AdditionalDependencies unconditionally, so a missing library is a hard
      # LNK1104 rather than a graceful degradation.

      - run:
          name: Install Python (Essentia code generation)
          # Builds/Windows/CMakeLists.txt does find_package(Python3 REQUIRED) to
          # run generate_essentia_build.py. Only the standard library is used.
          command: |
            if ! command -v python > /dev/null && ! command -v python3 > /dev/null; then
              choco install python3 -y --no-progress
              echo 'export PATH="/c/Python313:/c/Python313/Scripts:$PATH"' >> "$BASH_ENV"
            fi

      - run:
          name: Compute the Essentia cache key
          # Everything that changes the output: the submodule revision, and the
          # four files that decide what is compiled and against which
          # dependencies. Written to a file because CircleCI's checksum template
          # only reads files, not command output.
          command: |
            git -C Submodules/essentia rev-parse HEAD > essentia-cache-key.txt
            cat Audionaut/Builds/build_essentia_windows.ps1                 Audionaut/Builds/Windows/CMakeLists.txt                 Audionaut/Builds/Windows/VcpkgDeps.cmake                 Audionaut/Builds/Windows/generate_essentia_build.py >> essentia-cache-key.txt

      - restore_cache:
          keys:
            # No partial-match fallback key: a stale essentia.lib that does not
            # match the current sources would link and then misbehave at
            # runtime, which is worse than paying for a rebuild.
            - essentia-v1-{{ arch }}-{{ checksum "essentia-cache-key.txt" }}

      - run:
          name: Build Essentia
          # A cache hit restores both the library and the vcpkg tree, so this
          # becomes a no-op. On a miss the vcpkg FFmpeg build dominates the job.
          command: |
            if [ -f "Submodules/essentia/build-msvc/lib/$BUILD_TYPE/essentia.lib" ]; then
              echo "Restored from cache - skipping"
              exit 0
            fi
            powershell.exe -NoProfile -ExecutionPolicy Bypass               -File Audionaut/Builds/build_essentia_windows.ps1               -Configuration "$BUILD_TYPE"               -VcpkgRoot "$VCPKG_ROOT_DIR"               -Triplet "$VCPKG_TRIPLET"
          no_output_timeout: 90m

      - save_cache:
          key: essentia-v1-{{ arch }}-{{ checksum "essentia-cache-key.txt" }}
          paths:
            - Submodules/essentia/build-msvc
            # The installed tree only - not vcpkg's buildtrees/packages, which
            # are intermediates and dwarf it.
            - C:/Users/circleci/vcpkg/installed

      - run:
          name: Build the app
          # vswhere locates MSBuild - the image does not put it on PATH.
          # -m builds projects in parallel; the solution only defines x64.
          command: |
            MSBUILD=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
              -latest -requires Microsoft.Component.MSBuild \
              -find 'MSBuild\**\Bin\MSBuild.exe' | head -1 | tr -d '\r')
            echo "MSBuild: $MSBUILD"
            "$MSBUILD" Audionaut/Builds/VisualStudio2026/Audionaut.sln \
              -m \
              -p:Configuration="$BUILD_TYPE" \
              -p:Platform=x64 \
              -p:PlatformToolset="$APP_TOOLSET" \
              -v:minimal
          no_output_timeout: 30m

      - run:
          name: Build the installer
          # The .nsi packs the Release x64 exe the previous step just built.
          # Run makensis from the script's directory so its relative File
          # paths (..\..\Builds\...) resolve. NSIS is not preinstalled on the
          # image. Placed before the test steps so a test failure does not
          # block the installer artifact.
          working_directory: Audionaut/Installers/NSIS
          command: |
            choco install nsis -y --no-progress
            "/c/Program Files (x86)/NSIS/makensis.exe" Audionaut-Installer.nsi

      # Shows up on the job's Artifacts tab. CI smoke-check output, not a
      # release channel - artifacts expire (30 days by default) and the exe is
      # unsigned.
      - store_artifacts:
          path: Audionaut/Installers/NSIS/Audionaut Setup.exe
          destination: Audionaut-Setup.exe

      - run:
          name: Configure tests
          # No -DCMAKE_BUILD_TYPE: the Visual Studio generator is multi-config
          # and ignores it - the configuration is chosen at build time with
          # --config instead. No toolset pin either: CMake generates its own
          # project files and picks the image's installed toolset; only the
          # checked-in .vcxproj hardcodes one.
          command: |
            if ! command -v cmake > /dev/null; then
              choco install cmake -y --no-progress \
                --installargs 'ADD_CMAKE_TO_PATH=System'
              echo 'export PATH="/c/Program Files/CMake/bin:$PATH"' >> "$BASH_ENV"
              source "$BASH_ENV"
            fi
            cmake -B build -S Audionaut/Catch2Tests                   -DAUDIONAUT_VCPKG_PREFIX="$AUDIONAUT_VCPKG_PREFIX"

      - run:
          name: Build tests
          command: cmake --build build --config "$BUILD_TYPE" --parallel
          no_output_timeout: 30m

      - run:
          name: Run tests
          working_directory: build
          # --no-tests=error: ctest's default is to pass when it finds no tests
          # at all - fail loudly instead.
          command: ctest -C "$BUILD_TYPE" --output-on-failure --no-tests=error

workflows:
  windows:
    jobs:
      - build-windows:
          filters:
            branches:
              only:
                - main
                - develop

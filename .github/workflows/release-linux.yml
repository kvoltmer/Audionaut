name: Linux Release

# Builds the Release Linux binary, packages it as an AppImage and a .deb, and
# attaches both to a GitHub Release. Trigger by pushing a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# The tag must match the version in Audionaut.jucer (checked below).
#
# Can also be run manually from the Actions tab to exercise the build and both
# packaging paths - a manual run skips the tag check and publishes nothing.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Check tag matches .jucer version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        JUCER_VERSION=$(grep -o 'version="[0-9]\+\.[0-9]\+\.[0-9]\+"' Audionaut/Audionaut.jucer | head -1 | cut -d'"' -f2)
        echo "tag: $TAG_VERSION  .jucer: $JUCER_VERSION"
        if [ "$TAG_VERSION" != "$JUCER_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match Audionaut.jucer version ($JUCER_VERSION). Bump the .jucer version (and re-save with Projucer) or fix the tag."
          exit 1
        fi

    - name: Install dependencies
      # equivs builds the .deb from Audionaut/Builds/Debian.
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev equivs

    - name: Build Essentia
      uses: ./.github/actions/build-essentia

    - name: Compile (Release)
      run: make -C Audionaut/Builds/LinuxMakefile/ CONFIG=Release -j$(nproc)

    - name: Package AppImage
      # linuxdeploy collects the binary's shared-library dependencies into a
      # self-contained AppDir and wraps it as an AppImage. Built on
      # ubuntu-22.04 so the bundled glibc baseline stays broad.
      # --appimage-extract-and-run: hosted runners have no FUSE.
      # VERSION (which linuxdeploy puts in the AppImage filename) comes from the
      # .jucer rather than the tag, so manual runs off a branch are named
      # properly too; on a tag run the check above proves the two agree.
      run: |
        VERSION=$(grep -o 'version="[0-9]\+\.[0-9]\+\.[0-9]\+"' Audionaut/Audionaut.jucer | head -1 | cut -d'"' -f2)
        export VERSION
        cp Audionaut/Resources/audionaut_logo_512x512.png audionaut.png
        curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy
        ./linuxdeploy --appimage-extract-and-run \
          --appdir AppDir \
          --executable Audionaut/Builds/LinuxMakefile/build/audionaut \
          --desktop-file Audionaut/Resources/audionaut.desktop \
          --icon-file audionaut.png \
          --output appimage
        ls -l *.AppImage

    - name: Package .deb
      # Packages the binary compiled above - no second build. deploy.sh reads
      # the version from the .jucer and drops the .deb next to itself.
      run: |
        Audionaut/Builds/Debian/deploy.sh --no-build
        ls -l Audionaut/Builds/Debian/*.deb

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # audionaut_* rather than audionaut* keeps the audionaut-dbgsym_*.ddeb
        # that dh_strip emits off the release.
        ARTIFACTS=(Audionaut-*.AppImage Audionaut/Builds/Debian/audionaut_*.deb)
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" --clobber
        else
          gh release create "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" \
            --title "Audionaut $GITHUB_REF_NAME" --generate-notes
        fi

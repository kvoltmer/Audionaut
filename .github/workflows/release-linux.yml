name: Linux Release

# Builds the Release Linux binary, packages it as an AppImage, a .deb and a
# Flatpak bundle, and attaches all three to a GitHub Release. Trigger by
# pushing a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# The tag must match the version in Audionaut.jucer (checked below).
#
# Can also be run manually from the Actions tab to exercise the build and the
# packaging paths - a manual run skips the tag check and publishes nothing.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Check tag matches .jucer version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        JUCER_VERSION=$(grep -o 'version="[0-9]\+\.[0-9]\+\.[0-9]\+"' Audionaut/Audionaut.jucer | head -1 | cut -d'"' -f2)
        echo "tag: $TAG_VERSION  .jucer: $JUCER_VERSION"
        if [ "$TAG_VERSION" != "$JUCER_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match Audionaut.jucer version ($JUCER_VERSION). Bump the .jucer version (and re-save with Projucer) or fix the tag."
          exit 1
        fi

    - name: Install dependencies
      # equivs builds the .deb from Audionaut/Builds/Debian.
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libxi-dev libegl-dev equivs

    - name: Build Essentia
      uses: ./.github/actions/build-essentia

    - name: Write analytics credentials
      # the GA4 API secret is never committed; without the repository
      # secret the release ships with analytics disabled. The check has to
      # live in the script: the secrets context is not allowed in a step
      # `if`, and using it there makes GitHub reject the whole workflow.
      env:
        GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
      run: |
        if [ -z "$GA4_API_SECRET" ]; then
          echo "GA4_API_SECRET not set - building with analytics disabled"
          exit 0
        fi
        printf '#pragma once\n#define GA4_API_SECRET "%s"\n' "$GA4_API_SECRET" > Audionaut/Source/Application/AnalyticsCredentials.h

    - name: Compile (Release)
      run: make -C Audionaut/Builds/LinuxMakefile/ CONFIG=Release -j$(nproc)

    - name: Package AppImage
      # linuxdeploy collects the binary's shared-library dependencies into a
      # self-contained AppDir and wraps it as an AppImage. Built on
      # ubuntu-22.04 so the bundled glibc baseline stays broad.
      # --appimage-extract-and-run: hosted runners have no FUSE.
      # VERSION (which linuxdeploy puts in the AppImage filename) comes from the
      # .jucer rather than the tag, so manual runs off a branch are named
      # properly too; on a tag run the check above proves the two agree.
      run: |
        VERSION=$(grep -o 'version="[0-9]\+\.[0-9]\+\.[0-9]\+"' Audionaut/Audionaut.jucer | head -1 | cut -d'"' -f2)
        export VERSION
        cp Audionaut/Resources/audionaut_logo_512x512.png audionaut.png
        curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy
        ./linuxdeploy --appimage-extract-and-run \
          --appdir AppDir \
          --executable Audionaut/Builds/LinuxMakefile/build/audionaut \
          --desktop-file Audionaut/Resources/audionaut.desktop \
          --icon-file audionaut.png \
          --output appimage
        ls -l *.AppImage

    - name: Package .deb
      # Packages the binary compiled above - no second build. deploy.sh reads
      # the version from the .jucer and drops the .deb next to itself.
      run: |
        Audionaut/Builds/Debian/deploy.sh --no-build
        ls -l Audionaut/Builds/Debian/*.deb

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # audionaut_* rather than audionaut* keeps the audionaut-dbgsym_*.ddeb
        # that dh_strip emits off the release.
        ARTIFACTS=(Audionaut-*.AppImage Audionaut/Builds/Debian/audionaut_*.deb)
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" --clobber
        else
          gh release create "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" \
            --title "Audionaut $GITHUB_REF_NAME" --generate-notes
        fi

  flatpak:
    # Builds the Flatpak bundle from Audionaut/Builds/Flatpak. Independent of
    # the package job: flatpak-builder compiles everything itself inside the
    # GNOME SDK, fetching sources from the manifest (sync-pins.py first points
    # the manifest's git pins at the ref being built, so the committed pins
    # never go stale in a release).
    #
    # ubuntu-24.04 for flatpak-builder 1.4.x: 22.04's 1.2.x cannot clone
    # nested submodule mirrors pinned behind branch heads and still invokes
    # the legacy appstream-compose, which the GNOME 48 SDK no longer ships.
    # Unlike the package job, nothing here links against the runner's glibc
    # (the whole build happens inside the SDK), so the newer runner is safe.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Check tag matches .jucer version
      # Same check as the package job; jobs are independent so each guards
      # its own upload.
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        JUCER_VERSION=$(grep -o 'version="[0-9]\+\.[0-9]\+\.[0-9]\+"' Audionaut/Audionaut.jucer | head -1 | cut -d'"' -f2)
        echo "tag: $TAG_VERSION  .jucer: $JUCER_VERSION"
        if [ "$TAG_VERSION" != "$JUCER_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match Audionaut.jucer version ($JUCER_VERSION). Bump the .jucer version (and re-save with Projucer) or fix the tag."
          exit 1
        fi

    - name: Install flatpak-builder
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

    - name: Point the manifest at this ref
      # sync-pins.py rewrites the manifest's app tag/commit to the ref being
      # built and refreshes the submodule pins from this checkout's gitlinks.
      # Only link and demucs.cpp need initializing - they contain the two
      # nested pins (asio-standalone, eigen); the top-level pins are read
      # straight from the tree.
      run: |
        git submodule update --init Submodules/link Submodules/demucs.cpp
        REF_TYPE=branch
        [ "$GITHUB_REF_TYPE" = "tag" ] && REF_TYPE=tag
        python3 Audionaut/Builds/Flatpak/sync-pins.py \
          --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
          --ref "$GITHUB_REF_NAME" --ref-type "$REF_TYPE" --commit "$GITHUB_SHA"

    - name: Restore flatpak-builder cache
      # Source downloads (git mirrors, tarballs) plus ccache; cuts a full
      # rebuild from ~45 to a few minutes when the manifest barely changed.
      uses: actions/cache@v4
      with:
        path: .flatpak-builder
        key: flatpak-builder-${{ hashFiles('Audionaut/Builds/Flatpak/app.audionaut.Audionaut.yml') }}
        restore-keys: flatpak-builder-

    - name: Build Flatpak
      run: |
        flatpak-builder --user --force-clean --ccache --repo=flatpak-repo \
          build-dir Audionaut/Builds/Flatpak/app.audionaut.Audionaut.yml

    - name: Bundle
      # Same VERSION-from-.jucer convention as the AppImage step.
      run: |
        VERSION=$(grep -o 'version="[0-9]\+\.[0-9]\+\.[0-9]\+"' Audionaut/Audionaut.jucer | head -1 | cut -d'"' -f2)
        flatpak build-bundle flatpak-repo "Audionaut-$VERSION-x86_64.flatpak" \
          app.audionaut.Audionaut master
        ls -l *.flatpak

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # The package job usually creates the release well before this job
        # finishes; create it here too in case this one wins the race.
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" Audionaut-*.flatpak --clobber
        else
          gh release create "$GITHUB_REF_NAME" Audionaut-*.flatpak \
            --title "Audionaut $GITHUB_REF_NAME" --generate-notes
        fi

name: Code coverage

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  coverage:
    # Linux/GCC rather than the macOS runner used by the Catch2 workflow: gcov
    # is native here, so gcovr needs no llvm-cov shim.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # Some test wavs (see .gitattributes) live in Git LFS; without this the
    # tests get pointer stubs and fail loading them. A separate step rather
    # than `lfs: true` on the checkout: that option also smudges LFS pointers
    # inside the essentia submodule, whose upstream has LFS disabled, and the
    # resulting download error fails the whole checkout.
    - name: Fetch Git LFS test files
      run: git lfs pull

    - name: Install JUCE build dependencies
      # nasm is not for JUCE: ffmpeg (built from source as an Essentia
      # 3rd-party dep below) refuses to configure without an x86 assembler.
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm libasound2-dev libjack-jackd2-dev ladspa-sdk \
          libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev \
          libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
          libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
          mesa-common-dev libdrm-dev xvfb

    - name: Install gcovr
      run: pipx install gcovr

    # Essentia (the audio-analysis backend) is built from the submodule tree.
    # Without it ESSENTIA_ENABLED auto-detects off and the analysis code
    # compiles to no-ops - the coverage number would silently exclude one of
    # the better-tested engine subsystems.
    - name: Set up Python for waf
      # Essentia's bundled waf needs stdlib distutils, removed in Python 3.12+.
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Pin CMake 3.x for the legacy Essentia 3rd-party builds
      # Essentia's 3rd-party deps ship CMakeLists from 2012-2016 that CMake 4.x
      # refuses. Same pin as the Catch2 workflow.
      run: |
        pip install "cmake~=3.31.0"
        echo "cmake: $(command -v cmake)  $(cmake --version | head -1)"

    - name: Essentia submodule revision
      id: essentia-rev
      run: echo "sha=$(git -C Submodules/essentia rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Restore/save are split so a partial build from a failed run never poisons
    # the cache - see the comment in cmake-single-platform.yml.
    - name: Restore Essentia cache
      id: cache-essentia
      uses: actions/cache/restore@v4
      with:
        path: |
          Submodules/essentia/build
          Submodules/essentia/src/version.h
          Submodules/essentia/packaging/debian_3rdparty/include
          Submodules/essentia/packaging/debian_3rdparty/lib
        key: essentia-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.essentia-rev.outputs.sha }}-${{ hashFiles('Audionaut/Builds/build_essentia.sh') }}

    - name: Build Essentia
      if: steps.cache-essentia.outputs.cache-hit != 'true'
      run: ./Audionaut/Builds/build_essentia.sh

    - name: Save Essentia cache
      if: steps.cache-essentia.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          Submodules/essentia/build
          Submodules/essentia/src/version.h
          Submodules/essentia/packaging/debian_3rdparty/include
          Submodules/essentia/packaging/debian_3rdparty/lib
        key: essentia-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.essentia-rev.outputs.sha }}-${{ hashFiles('Audionaut/Builds/build_essentia.sh') }}

    - name: Configure
      # Debug is required, not incidental: the coverage flags are appended to the
      # target, but JUCE's recommended config flags inject -O3 for other build
      # types through INTERFACE options that land later on the command line.
      run: |
        cmake -B build-coverage -S Audionaut/Catch2Tests \
          -DCMAKE_BUILD_TYPE=Debug \
          -DAUDIONAUT_ENABLE_COVERAGE=ON

    - name: Build
      run: cmake --build build-coverage -j$(nproc)

    - name: Run tests
      working-directory: build-coverage
      # --no-tests=error: ctest passes by default when it finds no tests, which
      # is how a missing enable_testing() made this step a silent no-op - and
      # here it would also have produced a coverage number from an unrun suite.
      # xvfb-run: the export tests construct a ThreadWithProgressWindow, and
      # JUCE's AlertWindow layout segfaults without a display to measure.
      run: xvfb-run -a ctest --output-on-failure --no-tests=error

    - name: Generate coverage report
      # Mirrors the `coverage` CMake target. --root is the repo root, not
      # Audionaut/Source: gcovr resolves --filter against it, and rooting at the
      # source dir filters every file back out. --gcov-ignore-errors is required
      # because some Essentia headers defeat gcovr's working-dir inference.
      working-directory: build-coverage
      run: |
        mkdir -p coverage-html
        gcovr --root "$GITHUB_WORKSPACE" \
              --filter "$GITHUB_WORKSPACE/Audionaut/Source" \
              --gcov-ignore-errors=no_working_dir_found \
              --exclude-unreachable-branches \
              --print-summary \
              --xml coverage.xml \
              --html-details coverage-html/index.html \
              . | tee "$GITHUB_WORKSPACE/coverage-summary.txt"

    - name: Publish summary
      # Surfaces the number on the run page so a regression is visible without
      # downloading the artifact.
      run: |
        {
          echo '## Code coverage'
          echo
          echo '```'
          cat coverage-summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          build-coverage/coverage.xml
          build-coverage/coverage-html/
        retention-days: 14

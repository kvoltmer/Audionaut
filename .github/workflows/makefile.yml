name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Submodules are initialised explicitly rather than recursively: the
    # gaborgandalf checkout is private, so a recursive clone would fail here on
    # the workflow token, which is scoped to this repository alone. It is only
    # needed by AutoEdit's optional Python path, which CI does not exercise.
    - name: Check out the submodules CI needs
      run: |
        # actions/checkout rewrites .gitmodules' SSH URLs to HTTPS only when it
        # handles submodules itself, so it is done explicitly here.
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init \
          Submodules/JUCE \
          Submodules/Catch2 \
          Submodules/json \
          Submodules/link \
          Submodules/farbot \
          Submodules/essentia
        # Only link needs its nested submodule - the build includes asio from it.
        # Recursing further would pull essentia's test/models, whose Git LFS
        # objects are not downloadable ("Git LFS is disabled for this
        # repository"), and farbot's googletest, which nothing here uses.
        git submodule update --init --recursive Submodules/link

    - name: Install dependencies
      run: sudo apt install libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
    
    - name: Compile
      run: make -C Audionaut/Builds/LinuxMakefile/


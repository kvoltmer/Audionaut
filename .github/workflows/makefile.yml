name: Makefile CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install dependencies
      # apt update first: the runner image's package index goes stale and
      # apt install then 404s on superseded package versions.
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

    # The Makefile links Essentia's static libs from the submodule tree;
    # build (or restore from cache) them before compiling the app.
    - name: Build Essentia
      uses: ./.github/actions/build-essentia

    - name: Compile
      run: make -C Audionaut/Builds/LinuxMakefile/ -j$(nproc)

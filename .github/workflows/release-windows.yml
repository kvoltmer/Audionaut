name: Windows Release

# Builds the Release Windows binary, packages it as an NSIS installer, and
# attaches it to a GitHub Release. Trigger by pushing a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# The tag must match the version in Audionaut.jucer (checked below).
#
# Can also be run manually from the Actions tab to exercise the build and the
# packaging - a manual run skips the tag check and publishes nothing. The
# optional `ref` input builds another commit or tag with this workflow file,
# e.g. to rebuild a shipped release for its PDB (see "Keep the PDB" below).
#
# Runs alongside the Linux release workflow on the same tag; both attach
# their artifacts to one Release (whichever finishes first creates it).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or tag to build (default: the branch this run is started from)'
        required: false
        default: ''

permissions:
  contents: write

env:
  BUILD_TYPE: Release

  # No toolset pin: the windows-2025 image ships Visual Studio 2026, so the
  # v145 the .vcxproj asks for is what MSBuild picks natively. See windows.yml.

jobs:
  package:

    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Checkout submodules
      uses: ./.github/actions/checkout-submodules

    # No `git lfs pull`: the LFS files are test wavs, and this workflow runs
    # no tests.

    - name: Check tag matches .jucer version
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        JUCER_VERSION=$(grep -o 'version="[0-9]\+\.[0-9]\+\.[0-9]\+"' Audionaut/Audionaut.jucer | head -1 | cut -d'"' -f2)
        echo "tag: $TAG_VERSION  .jucer: $JUCER_VERSION"
        if [ "$TAG_VERSION" != "$JUCER_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match Audionaut.jucer version ($JUCER_VERSION). Bump the .jucer version (and re-save with Projucer) or fix the tag."
          exit 1
        fi

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        # setup-msbuild defaults to the x86 MSBuild. Since the runner image's
        # MSVC 14.51 update, the x86-hosted compiler exhausts its heap on this
        # solution ("fatal error C1002: compiler is out of heap space in
        # pass 2" - broke the v1.4.0 release cut). Use the 64-bit chain, as
        # windows.yml already does.
        msbuild-architecture: x64

    - name: Write analytics credentials
      # the GA4 API secret is never committed; without the repository
      # secret the release ships with analytics disabled. The check has to
      # live in the script: the secrets context is not allowed in a step
      # `if`, and using it there makes GitHub reject the whole workflow.
      shell: pwsh
      env:
        GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
      run: |
        if (-not $env:GA4_API_SECRET) {
          Write-Host "GA4_API_SECRET not set - building with analytics disabled"
          exit 0
        }
        "#pragma once`n#define GA4_API_SECRET `"$env:GA4_API_SECRET`"`n" | Set-Content -NoNewline -Encoding ascii Audionaut/Source/Application/AnalyticsCredentials.h

    - name: Build the app
      # -m builds projects in parallel; the solution only defines x64.
      # PreferredToolArchitecture keeps cl.exe itself x64-hosted (the C1002
      # heap ceiling is a property of the x86-hosted compiler).
      run: >
        msbuild Audionaut/Builds/VisualStudio2026/Audionaut.sln
        -m
        -p:Configuration=${{ env.BUILD_TYPE }}
        -p:Platform=x64
        -p:PreferredToolArchitecture=x64
        -v:minimal

    - name: Build the installer
      # The .nsi packs the Release x64 exe the previous step just built. Run
      # makensis from the script's directory so its relative File paths
      # (..\..\Builds\...) resolve. The runner image ships NSIS; the choco
      # install is only a guard against an image that stops doing so. The
      # rename gives the artifact a versioned Release filename (mirroring the
      # AppImage) without touching the .nsi; VERSION comes from the .jucer
      # rather than the tag, so manual runs off a branch are named properly
      # too - on a tag run the check above proves the two agree.
      working-directory: Audionaut/Installers/NSIS
      shell: bash
      run: |
        MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
        if [ ! -f "$MAKENSIS" ]; then
          choco install nsis -y --no-progress
        fi
        "$MAKENSIS" Audionaut-Installer.nsi
        VERSION=$(grep -o 'version="[0-9]\+\.[0-9]\+\.[0-9]\+"' ../../Audionaut.jucer | head -1 | cut -d'"' -f2)
        mv "Audionaut Setup.exe" "Audionaut-$VERSION-Setup.exe"
        ls -l Audionaut-*-Setup.exe
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Keep the PDB
      # The crash reporter (Source/Application/CrashReporter.cpp) writes
      # module+offset backtraces, and only the PDB of the exact build turns
      # those into source lines. Zip it next to the exe it belongs to; the
      # exe is what a rebuilt PDB is checked against (same code bytes) when
      # the shipped build's PDB is no longer around.
      shell: bash
      run: |
        mkdir -p symbols
        cp Audionaut/Builds/VisualStudio2026/x64/Release/App/Audionaut.pdb symbols/
        cp Audionaut/Builds/VisualStudio2026/x64/Release/App/Audionaut.exe symbols/
        7z a -tzip "Audionaut-$VERSION-windows-x64-symbols.zip" ./symbols/*
        ls -l Audionaut-*-symbols.zip

    - name: Upload the PDB as a workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: Audionaut-${{ env.VERSION }}-windows-x64-symbols
        path: Audionaut-*-windows-x64-symbols.zip
        if-no-files-found: error

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # The Linux release workflow runs on the same tag; the `|| upload`
        # covers losing the race to its `gh release create`.
        ARTIFACTS=(Audionaut/Installers/NSIS/Audionaut-*-Setup.exe
                   Audionaut-*-windows-x64-symbols.zip)
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" --clobber
        else
          gh release create "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" \
            --title "Audionaut $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" --clobber
        fi

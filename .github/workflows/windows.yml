name: Windows CI

# Builds the Projucer-generated Visual Studio solution with MSBuild, then
# builds and runs the Catch2 suite. Windows was previously uncovered - the
# other workflows run macOS and Ubuntu only - which let an MSVC-only break
# reach develop: <windows.h> declares a global Rectangle() GDI function that
# collides with juce::Rectangle wherever a file does `using namespace juce`.
# Header-collision bugs of that shape are invisible to the other runners.
#
# This is the Windows gate for pull requests; the CircleCI job
# (.circleci/config.yml) mirrors it for pushes to main/develop and adds the
# installer artifact. Keep the two in sync.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  BUILD_TYPE: Release

  # The runner image ships Visual Studio 2022 (toolset v143); the .vcxproj that
  # Projucer generates asks for v145 (VS 2026), which no hosted image provides.
  # Override on the command line rather than in the .jucer - the checked-in
  # project must keep matching the toolset developers build with locally, and
  # v143 still compiles the C++20 the project needs. Drop this once a runner
  # image ships v145.
  APP_TOOLSET: v143

  # Essentia's Windows dependencies. The triplet must stay
  # x64-windows-static-md - static libraries against the dynamic CRT, which
  # is what both the .vcxproj and the JUCE CMake test target use. The vcpkg
  # root is the runner image's preinstalled clone.
  VCPKG_TRIPLET: x64-windows-static-md
  VCPKG_ROOT_DIR: C:/vcpkg
  # Read by the .vcxproj, which expands $(AUDIONAUT_VCPKG_PREFIX) in its
  # include and library paths, and passed to the test configure.
  AUDIONAUT_VCPKG_PREFIX: C:/vcpkg/installed/x64-windows-static-md

jobs:
  build:

    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # Some test wavs (see .gitattributes) live in Git LFS; without this the
    # tests get pointer stubs and fail loading them. A separate step rather
    # than `lfs: true` on the checkout: that option also smudges LFS pointers
    # inside the essentia submodule, whose upstream has LFS disabled, and the
    # resulting download error fails the whole checkout.
    - name: Fetch Git LFS test files
      run: git lfs pull

    # Essentia. build_essentia.sh cannot be used - it is a bash + waf script
    # targeting macOS/Linux - so this runs the CMake + vcpkg port instead.
    # It has to come before the app build: the .vcxproj lists essentia.lib in
    # AdditionalDependencies unconditionally, so a missing library is a hard
    # linker error rather than a graceful degradation. Python and CMake are
    # preinstalled on the runner image.

    - name: Compute the Essentia cache key
      # Everything that changes the output: the submodule revision, and the
      # five files that decide what is compiled and against which
      # dependencies. Written to a file so hashFiles() can consume it.
      shell: bash
      run: |
        git -C Submodules/essentia rev-parse HEAD > essentia-cache-key.txt
        cat Audionaut/Builds/build_essentia_windows.ps1 \
            Audionaut/Builds/Windows/CMakeLists.txt \
            Audionaut/Builds/Windows/VcpkgDeps.cmake \
            Audionaut/Builds/Windows/generate_essentia_build.py \
            Audionaut/Builds/Windows/triplets/x64-windows-static-md.cmake \
            >> essentia-cache-key.txt

    # Explicit restore/save pairs rather than the combined actions/cache: its
    # save runs in a post-job step only when the job succeeds, so an app-build
    # or test failure after a successful (hour-long) dependency build would
    # throw the caches away and every retry would start cold.
    - name: Restore the Essentia cache
      id: essentia-cache
      uses: actions/cache/restore@v4
      with:
        # No partial-match fallback key: a stale essentia.lib that does not
        # match the current sources would link and then misbehave at
        # runtime, which is worse than paying for a rebuild.
        key: essentia-v1-windows-${{ hashFiles('essentia-cache-key.txt') }}
        path: |
          Submodules/essentia/build-msvc
          C:/vcpkg/installed

    # vcpkg's binary package cache, separate from the exact-key cache above.
    # It is content-addressed per package (ABI hash), so a partial-match
    # fallback IS safe here: on a key change vcpkg re-checks every package
    # and reuses only the archives whose inputs are unchanged - e.g. an
    # essentia submodule bump no longer rebuilds ffmpeg from scratch.
    - name: Restore the vcpkg archives cache
      id: vcpkg-archives-cache
      uses: actions/cache/restore@v4
      with:
        key: vcpkg-archives-v1-windows-${{ hashFiles('essentia-cache-key.txt') }}
        restore-keys: |
          vcpkg-archives-v1-windows-
        path: ~/AppData/Local/vcpkg/archives

    - name: Build Essentia
      # A cache hit restores both the library and the vcpkg tree, so this
      # becomes a no-op. On a miss the vcpkg FFmpeg build dominates the job.
      # -ReleaseOnlyDeps skips the Debug flavour of the dependencies (nothing
      # in CI links it). The New-Item keeps the archive save below from
      # tripping over a missing directory when vcpkg never ran.
      run: |
        New-Item -ItemType Directory -Force "$env:LOCALAPPDATA/vcpkg/archives" | Out-Null
        if (Test-Path "Submodules/essentia/build-msvc/lib/$env:BUILD_TYPE/essentia.lib") {
          Write-Host "Restored from cache - skipping"
          exit 0
        }
        ./Audionaut/Builds/build_essentia_windows.ps1 `
          -Configuration $env:BUILD_TYPE `
          -VcpkgRoot $env:VCPKG_ROOT_DIR `
          -Triplet $env:VCPKG_TRIPLET `
          -ReleaseOnlyDeps

    # Saved right after the essentia build (not at the end of the job) so a
    # failure in the app build or tests does not throw the binaries away.
    - name: Save the Essentia cache
      if: steps.essentia-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: essentia-v1-windows-${{ hashFiles('essentia-cache-key.txt') }}
        path: |
          Submodules/essentia/build-msvc
          C:/vcpkg/installed

    - name: Save the vcpkg archives cache
      if: steps.vcpkg-archives-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: vcpkg-archives-v1-windows-${{ hashFiles('essentia-cache-key.txt') }}
        path: ~/AppData/Local/vcpkg/archives

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build the app
      # -m builds projects in parallel; the solution only defines x64.
      run: >
        msbuild Audionaut/Builds/VisualStudio2026/Audionaut.sln
        -m
        -p:Configuration=${{ env.BUILD_TYPE }}
        -p:Platform=x64
        -p:PlatformToolset=${{ env.APP_TOOLSET }}
        -v:minimal

    - name: Configure tests
      # No -DCMAKE_BUILD_TYPE: the Visual Studio generator is multi-config and
      # ignores it (CMake warns that the variable went unused). The
      # configuration is chosen at build time with --config instead.
      # No toolset pin either - CMake generates its own project files and picks
      # the runner's installed toolset; only the checked-in .vcxproj hardcodes one.
      run: >
        cmake -B build -S Audionaut/Catch2Tests
        -DAUDIONAUT_VCPKG_PREFIX=${{ env.AUDIONAUT_VCPKG_PREFIX }}

    - name: Build tests
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Run tests
      working-directory: build
      # --no-tests=error: ctest's default is to pass when it finds no tests at
      # all, which is how a missing enable_testing() once made this step "pass"
      # in a second without running an assertion. Fail loudly instead.
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --no-tests=error

name: Windows CI

# Builds the Projucer-generated Visual Studio solution with MSBuild, then
# builds and runs the Catch2 suite. Windows was previously uncovered - the
# other workflows run macOS and Ubuntu only - which let an MSVC-only break
# reach develop: <windows.h> declares a global Rectangle() GDI function that
# collides with juce::Rectangle wherever a file does `using namespace juce`.
# Header-collision bugs of that shape are invisible to the other runners.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  BUILD_TYPE: Release

  # The runner image ships Visual Studio 2022 (toolset v143); the .vcxproj that
  # Projucer generates asks for v145 (VS 2026), which no hosted image provides.
  # Override on the command line rather than in the .jucer - the checked-in
  # project must keep matching the toolset developers build with locally, and
  # v143 still compiles the C++20 the project needs. Drop this once a runner
  # image ships v145.
  APP_TOOLSET: v143

jobs:
  build:

    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # Essentia is deliberately NOT built here. Audionaut/Builds/build_essentia.sh
    # is a bash + waf script targeting macOS/Linux, so there is no Windows path
    # for it today. Both the app and the tests degrade cleanly without it:
    # AUDIONAUT_ENABLE_ESSENTIA auto-detects OFF and the analysis code
    # (BIC segmentation, onset detection, beat tracking) compiles out. This job
    # therefore guards Windows *compilation*, not the analysis features - those
    # stay covered by the macOS and Linux workflows.

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build the app
      # -m builds projects in parallel; the solution only defines x64.
      run: >
        msbuild Audionaut/Builds/VisualStudio2026/Audionaut.sln
        -m
        -p:Configuration=${{ env.BUILD_TYPE }}
        -p:Platform=x64
        -p:PlatformToolset=${{ env.APP_TOOLSET }}
        -v:minimal

    - name: Configure tests
      # No -DCMAKE_BUILD_TYPE: the Visual Studio generator is multi-config and
      # ignores it (CMake warns that the variable went unused). The
      # configuration is chosen at build time with --config instead.
      # No toolset pin either - CMake generates its own project files and picks
      # the runner's installed toolset; only the checked-in .vcxproj hardcodes one.
      run: cmake -B build -S Audionaut/Catch2Tests

    - name: Build tests
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Run tests
      working-directory: build
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

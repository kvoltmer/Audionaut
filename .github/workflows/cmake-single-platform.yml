# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Build and run Catch2 tests on macos 

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # Essentia (the audio-analysis backend) is built from the submodule tree; the
    # tests link the resulting static libs. Without it, ESSENTIA_ENABLED
    # auto-detects off and the analysis tests compile out.
    - name: Set up Python for waf
      # Essentia's bundled waf needs stdlib distutils, removed in Python 3.12+.
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Pin CMake 3.x for the legacy Essentia 3rd-party builds
      # Essentia's 3rd-party deps (taglib, chromaprint, ...) ship CMakeLists from
      # 2012-2016 that CMake 4.x refuses (removed <3.5 minimums and OLD policy
      # behaviour). The runner ships CMake 4.x; pin the last 3.x line, which also
      # builds the JUCE/Catch2 project fine (it needs only >= 3.15).
      run: |
        pip install "cmake~=3.31.0"
        echo "cmake: $(command -v cmake)  $(cmake --version | head -1)"

    - name: Install Essentia build tools
      run: brew install pkg-config

    - name: Essentia submodule revision
      id: essentia-rev
      run: echo "sha=$(git -C Submodules/essentia rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Restore/save are split (not the combined cache action) so the cache is
    # only written after a *successful* build - a partial build from a failed
    # run must never poison the cache (it would make CMake silently fall back to
    # Essentia-off and pass without exercising analysis).
    - name: Restore Essentia cache
      id: cache-essentia
      uses: actions/cache/restore@v4
      with:
        path: |
          Submodules/essentia/build
          Submodules/essentia/packaging/debian_3rdparty/include
          Submodules/essentia/packaging/debian_3rdparty/lib
        key: essentia-${{ runner.os }}-${{ runner.arch }}-${{ steps.essentia-rev.outputs.sha }}-${{ hashFiles('Audionaut/Builds/build_essentia.sh') }}

    - name: Build Essentia
      if: steps.cache-essentia.outputs.cache-hit != 'true'
      run: ./Audionaut/Builds/build_essentia.sh

    - name: Save Essentia cache
      # Reached only if Build Essentia succeeded (the job stops on failure).
      if: steps.cache-essentia.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          Submodules/essentia/build
          Submodules/essentia/packaging/debian_3rdparty/include
          Submodules/essentia/packaging/debian_3rdparty/lib
        key: essentia-${{ runner.os }}-${{ runner.arch }}-${{ steps.essentia-rev.outputs.sha }}-${{ hashFiles('Audionaut/Builds/build_essentia.sh') }}

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -S${{github.workspace}}/Audionaut/Catch2Tests -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}


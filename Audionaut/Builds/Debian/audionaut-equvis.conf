### Control file template for equivs-build. Do not run equivs-build on this
### file directly — deploy.sh substitutes @VERSION@ from Audionaut.jucer and
### writes the result to staging/audionaut.conf, which is what gets built.
### All relative paths below resolve against this directory (deploy.sh runs
### equivs-build from here).
Section: sound
Priority: optional
Homepage: https://audionaut.app/
Standards-Version: 4.6.2

Package: audionaut
Version: @VERSION@
Maintainer: Klaus Voltmer <vltmrkls@gmail.com>
Architecture: amd64

### Direct DT_NEEDED libraries of the binary, plus the X11 libraries that JUCE
### dlopens at runtime (these never show up in ldd, so they have to be listed
### by hand — see juce_XSymbols_linux.cpp). The t64 alternatives cover Ubuntu
### 24.04 / Debian trixie and later, the plain names cover older releases.
### desktop-file-utils, shared-mime-info and hicolor-icon-theme own the dpkg
### triggers that refresh the caches for the files installed below.
Depends: libc6, libgcc-s1, libstdc++6,
 libasound2t64 | libasound2,
 libcurl4t64 | libcurl4,
 libdrm2, libfontconfig1, libfreetype6,
 libx11-6, libxext6, libxcursor1, libxinerama1, libxrandr2, libxrender1,
 desktop-file-utils, shared-mime-info, hicolor-icon-theme
### Used only to inhibit the screensaver during playback; the app runs without it.
Recommends: libxss1

Copyright: ../../../LICENSE.md

Files: staging/audionaut /usr/bin
 staging/audionaut.desktop /usr/share/applications
 staging/audionaut.xml /usr/share/mime/packages
 staging/audionaut.png /usr/share/icons/hicolor/512x512/apps

Description: audio editing and audio recording
 Audionaut is a lightweight desktop application for effortless audio editing
 and audio recording of multitrack sessions.

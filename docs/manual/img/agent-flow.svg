<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-label="How an agent edit reaches Audionaut: Claude calls a tool on audionaut-mcp, which runs one verb through the Audionaut binary. If the project is open in the app, the verb is handed to the running app over loopback, runs on a copy of the live state and lands as one undo step without writing Project.json. If it is not open, the project file is read and written directly. The reply comes back as one JSON envelope.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bdbdbd"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fc3f7"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="960" height="390" rx="12" fill="#0d0d0d"/>

  <g font-family="Mulish, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- Claude -->
    <rect x="20" y="120" width="150" height="64" rx="8" fill="#161616" stroke="#555"/>
    <text x="95" y="148" font-size="15" font-weight="600" fill="#f2f2f2">Claude</text>
    <text x="95" y="168" font-size="12" fill="#8a8a8a">or any MCP client</text>

    <!-- audionaut-mcp -->
    <rect x="250" y="120" width="180" height="64" rx="8" fill="#161616" stroke="#555"/>
    <text x="340" y="148" font-size="14" font-weight="600" fill="#f2f2f2" font-family="'JetBrains Mono', Menlo, Consolas, monospace">audionaut-mcp</text>
    <text x="340" y="168" font-size="12" fill="#8a8a8a">npx · Node.js</text>
    <text x="340" y="208" font-size="11" fill="#8a8a8a">macOS: paths must be in ~/Music,</text>
    <text x="340" y="223" font-size="11" fill="#8a8a8a">checked before anything runs</text>

    <!-- Audionaut binary -->
    <rect x="510" y="120" width="180" height="64" rx="8" fill="#161616" stroke="#555"/>
    <text x="600" y="148" font-size="15" font-weight="600" fill="#f2f2f2">Audionaut</text>
    <text x="600" y="168" font-size="12" fill="#8a8a8a">the app binary, no window</text>

    <!-- Claude -> mcp -->
    <line x1="170" y1="152" x2="246" y2="152" stroke="#bdbdbd" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="210" y="142" font-size="12" fill="#bdbdbd">tool call</text>
    <text x="210" y="170" font-size="11" fill="#8a8a8a">e.g. split</text>

    <!-- mcp -> binary -->
    <line x1="430" y1="152" x2="506" y2="152" stroke="#bdbdbd" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="470" y="142" font-size="12" fill="#bdbdbd">one verb</text>
    <text x="470" y="170" font-size="11" fill="#8a8a8a" font-family="'JetBrains Mono', Menlo, Consolas, monospace">--json</text>

    <!-- open in the app: handed over (accent) -->
    <path d="M600,120 V95 H756" fill="none" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="678" y="70" font-size="12" fill="#4fc3f7">project open in the app:</text>
    <text x="678" y="86" font-size="12" fill="#4fc3f7">handed over via loopback</text>

    <!-- your Audionaut window -->
    <rect x="760" y="20" width="180" height="160" rx="8" fill="#161616" stroke="#4fc3f7" stroke-width="1.5"/>
    <text x="850" y="44" font-size="13" font-weight="600" fill="#f2f2f2">Your Audionaut window</text>
    <rect x="776" y="58" width="148" height="44" rx="6" fill="#1f1f1f" stroke="#555"/>
    <text x="850" y="77" font-size="12" fill="#f2f2f2">runs on a copy of</text>
    <text x="850" y="93" font-size="11" fill="#8a8a8a">the live state, unsaved too</text>
    <line x1="850" y1="102" x2="850" y2="114" stroke="#bdbdbd" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="776" y="118" width="148" height="44" rx="6" fill="#1f1f1f" stroke="#4fc3f7"/>
    <text x="850" y="137" font-size="12" font-weight="600" fill="#4fc3f7">one undo step</text>
    <text x="850" y="153" font-size="11" fill="#8a8a8a">⌘Z / Ctrl+Z takes it back</text>
    <text x="850" y="200" font-size="11" fill="#8a8a8a">Project.json is not written;</text>
    <text x="850" y="215" font-size="11" fill="#8a8a8a">saving stays yours</text>

    <!-- not open: the file -->
    <path d="M600,184 V282 H756" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
    <text x="678" y="258" font-size="12" fill="#bdbdbd">project not open:</text>
    <text x="678" y="274" font-size="12" fill="#bdbdbd">uses the file</text>
    <rect x="760" y="252" width="180" height="60" rx="8" fill="#161616" stroke="#555"/>
    <text x="850" y="278" font-size="13" font-weight="600" fill="#f2f2f2" font-family="'JetBrains Mono', Menlo, Consolas, monospace">Project.json</text>
    <text x="850" y="297" font-size="11" fill="#8a8a8a">read and written directly</text>

    <!-- reply -->
    <path d="M540,184 V338 H95 V188" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
    <text x="318" y="360" font-size="12" fill="#bdbdbd">reply: one JSON envelope,
      <tspan font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#8a8a8a">{ ok, result | error }</tspan></text>
  </g>
</svg>
